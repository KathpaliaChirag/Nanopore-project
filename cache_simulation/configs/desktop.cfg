# Overlay config simulating a typical consumer desktop CPU's cache hierarchy, in place of
# Luna's real server-class cache. Same pattern as luna.cfg: override layer on top of
# address_translation_schemes/baseline + meteor_lake_pcore, only cache geometry changed.
# Correct invocation: ./run-sniper -c address_translation_schemes/baseline -c desktop ...
#
# Target: AMD Ryzen 5 5600X (a genuinely common, well-documented mainstream desktop CPU,
# not a made-up "typical" number) - AMD's own published spec sheet + Zen 3 architecture docs:
#   L1d: 32KB, 8-way per core
#   L1i: 32KB, 8-way per core
#   L2:  512KB, 8-way per core
#   L3:  32MB, 16-way, shared across all 6 cores (single CCX/CCD on this part)
#   Base clock: 3.7GHz (boost 4.6GHz not used, matching the base-clock convention already
#   used for luna.cfg and Sniper's own gainestown.cfg)
#
# This is a CACHE-SIZE comparison only, same as orion_sizes.cfg - it does NOT change the
# underlying core microarchitecture model (still meteor_lake_pcore's timing model), so it
# answers "how does a much smaller hardware cache change the S2 design's payoff", not
# "how would this run on a real Zen 3 core." Associativity numbers here ARE AMD's real
# published spec (unlike Orion's, which are TRM-typical/unverified placeholders).

[perf_model/core]
frequency = 3.7 # AMD Ryzen 5 5600X documented base clock

[perf_model/l1_icache]
cache_size = 32
associativity = 8

[perf_model/l1_dcache]
cache_size = 32
associativity = 8

[perf_model/l2_cache]
cache_size = 512
associativity = 8

[perf_model/nuca]
cache_size = 5461        # KB per-core slice = 32768 KB (32MB) / 6 real cores sharing this L3
associativity = 16       # AMD published spec (real, not placeholder)
address_hash = mod       # REQUIRED - 5461 sets is not a power of 2, same xor_mod bug as luna.cfg
                          # (see luna.cfg's own comment / command_log.md steps 27-28 for the full
                          # explanation: xor_mod's XOR-based indexing only stays in-bounds for
                          # power-of-2 set counts, plain "mod" has no such restriction)
