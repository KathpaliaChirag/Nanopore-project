# Overlay config for CK's own laptop (AMD Ryzen 7 5800H "Cezanne", Zen 3 mobile)
#
# Same overlay pattern as luna.cfg/desktop.cfg/orion_sizes.cfg - load AFTER
# address_translation_schemes/baseline:
#   ./run-sniper -c address_translation_schemes/baseline -c laptop ...
#
# Core count/frequency/L2/L3 total size pulled directly from this machine via
# PowerShell (Get-CimInstance Win32_Processor), 2026-09-15:
#   Name: AMD Ryzen 7 5800H, 8 cores, MaxClockSpeed 3201 MHz (matches AMD's
#   documented 3.2GHz base clock), L2CacheSize 4096 KB total, L3CacheSize
#   16384 KB total. WMI does not expose L1 size/associativity or any
#   associativity numbers - those come from AMD's published Zen 3 microarch
#   spec (32KB/8-way L1i, 32KB/8-way L1d, 512KB/8-way L2 per core, 16-way L3),
#   not independently measured on this exact chip.
#
# L3 (16MB total, one CCX for mobile Cezanne - all 8 cores share a single L3,
# unlike some desktop Zen3 SKUs split across two CCDs) modeled as NUCA slices,
# same approach as luna.cfg: 16384 KB / 8 cores = 2048 KB/core slice.
# 2048 KB / (16-way * 64B) = 2048 sets exactly - a power of 2, so (unlike
# Luna's 1200-set case) the default xor_mod hash is safe here, no override
# needed.
#
# NOT real/measured: DRAM latency/bandwidth/timing (inherited from the
# baseline chain's dram_configs/ddr4_2400.cfg, a generic default, same
# caveat as every other hardware profile in this project) and core pipeline
# internals (ROB size, dispatch width, branch predictor - inherited from
# meteor_lake_pcore.cfg wholesale, not Zen 3-specific).

[perf_model/core]
frequency = 3.2 # AMD-documented base clock for Ryzen 7 5800H, matches WMI MaxClockSpeed

[perf_model/l1_icache]
cache_size = 32          # KB - AMD Zen 3 published spec (not WMI-exposed)
associativity = 8        # AMD Zen 3 published spec

[perf_model/l1_dcache]
cache_size = 32           # KB - AMD Zen 3 published spec
associativity = 8         # AMD Zen 3 published spec

[perf_model/l2_cache]
cache_size = 512          # KB, private per core - WMI total (4096KB) / 8 cores = 512KB, matches
                           # AMD's published per-core L2 spec exactly
associativity = 8         # AMD Zen 3 published spec

[perf_model/nuca]
cache_size = 2048         # KB per-core slice - WMI total L3 (16384KB) / 8 cores, exact split,
                           # no rounding needed (2048 sets * 16-way * 64B = 2048KB exactly)
associativity = 16        # AMD Zen 3 published spec (single shared L3 CCX for this mobile part)
                           # xor_mod (inherited default) is safe here - 2048 sets is a power of 2
