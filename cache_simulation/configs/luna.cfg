# Overlay config for Luna (student@dell-R760, dual-socket Intel Xeon Platinum 8468 "Sapphire Rapids")
#
# This is NOT a standalone base config - it's an override layer, meant to be loaded AFTER
# address_translation_schemes/baseline (which pulls in base_system_sniperspace, core_configs/
# meteor_lake_pcore, MMU/pagetable/DRAM configs - everything Sniper needs to actually run).
# Correct invocation (read run-sniper's own arg parser to confirm this - see command_log.md
# steps 18-23 for the full debugging trail, including two syntaxes that looked plausible but
# are wrong: a comma-joined single -c flag triggers Sniper's *heterogeneous per-core config*
# path, not file-chaining, and silently does the wrong thing):
#   ./run-sniper -c address_translation_schemes/baseline -c luna ...
# (TWO SEPARATE -c flags, plain names, no comma. run-sniper appends each to one configfiles
# list in the order given - baseline MUST come first, luna second, so luna's overrides apply
# on top instead of getting clobbered by baseline's meteor_lake_pcore defaults.)
#
# Base: core_configs/meteor_lake_pcore.cfg (Sniper's own default core config for this run chain -
# a 2023 Redwood Cove P-core model. L1d and L2 already happen to match Luna's real numbers exactly,
# so only L1i and the L3/LLC actually need overriding below).
#
# Cache geometry read directly from this exact machine via /sys/devices/system/cpu/cpu0/cache/index*/
# on 2026-09-04 - not taken from a vendor spec sheet. See command_log.md steps 11-21 for the full
# derivation, what's real vs. approximated, and the two invocation bugs found getting here.
#
# IMPORTANT - L3/LLC is NOT modeled as a flat cache in this chain. meteor_lake_pcore.cfg sets
# [perf_model/cache] levels = 2, and models the shared LLC as NUCA: distributed per-core slices
# on a mesh, not one monolithic bank. This is actually a more architecturally realistic model of
# Luna's real chip (modern Xeon Scalable LLCs are physically slice-per-core, mesh-connected) than a
# naive flat "one big L3" would be - but it means the real 105MB/15-way number sysfs gave us (the
# OS's logical/aggregate view) has to be split into a per-core slice size to fit this model:
#   107520 KB total / 96 real cores per socket = 1120 KB/core slice (exact split)
# Sniper strictly validates size = sets * associativity * block_size (aborts with SIGABRT rather
# than rounding if it doesn't divide evenly) - 1120 KB doesn't factor evenly at 15-way/64B (would
# need 1194.67 sets), so it's rounded to the nearest value that does: 1125 KB (1200 sets exactly),
# a further 0.45% deviation on top of the already-approximate even split across cores.
# Associativity (15-way) is assumed uniform per slice, same as the real aggregate sysfs reading -
# not independently verified per-slice, since sysfs only exposes the logical whole-cache view.
#
# NOT yet real/measured: NUCA data_access_time/tags_access_time and bandwidth are left at
# meteor_lake_pcore's own placeholder values (sysfs exposes geometry, not latency) - needs a real
# membench/pointer-chase measurement to replace. Replacement policy left at meteor's default `lru` -
# project memory already flags this exact machine's real LLC policy as an undocumented adaptive
# bimodal scheme (only reverse-engineered through Skylake-gen chips, not confirmed for Sapphire
# Rapids), so `lru` here is a known placeholder, not an asserted fact. DRAM config is entirely
# inherited from the baseline chain's dram_configs/ddr4_2400.cfg, not measured on Luna.

[perf_model/core]
frequency = 2.1 # Xeon Platinum 8468 documented base clock (Intel spec) - overrides meteor_lake_pcore's
                # 5.1 GHz, which is a *different* chip's peak turbo number, not applicable here

[perf_model/l1_icache]
cache_size = 32          # KB - sysfs real (meteor_lake_pcore default was 64 - overridden)
associativity = 8        # sysfs real (meteor_lake_pcore default was 16 - overridden)

[perf_model/l1_dcache]
cache_size = 48           # KB - sysfs real, matches meteor_lake_pcore's default exactly (confirmed, not just inherited)
associativity = 12        # sysfs real, matches meteor_lake_pcore's default exactly (confirmed, not just inherited)

[perf_model/l2_cache]
cache_size = 2048         # KB = 2MB, private per core - sysfs real, matches meteor_lake_pcore's default exactly
associativity = 16        # sysfs real, matches meteor_lake_pcore's default exactly

[perf_model/nuca]
cache_size = 1125         # KB per-core slice - target was 1120 (107520/96, exact), rounded up to 1125
                           # because Sniper requires size = sets * associativity * block_size exactly
                           # (1200 sets * 15 * 64B = 1125 KB); 1120 itself isn't a valid size at this
                           # associativity/block-size combination
associativity = 15        # sysfs real (whole-LLC aggregate reading, assumed uniform per slice) - overrides
                           # meteor_lake_pcore's default of 16
address_hash = mod        # REQUIRED override, not stylistic: meteor_lake_pcore's inherited "xor_mod"
                           # computes set_index via (block_num % sets) ^ ((block_num >> log2(sets)) % sets),
                           # which only stays within [0, sets) when sets is a power of 2 (see
                           # common/core/memory_subsystem/cache/cache_base.cc's HASH_XOR_MOD case). our
                           # 1200-set NUCA slice is not a power of 2, so xor_mod produced an out-of-bounds
                           # set_index -> SIGSEGV in CacheSet::find. plain "mod" (set_index = block_num %
                           # sets) has no such restriction and is safe for any set count. L1i/L1d/L2 keep
                           # xor_mod (inherited, unchanged) since their set counts (64/64/2048) are all
                           # powers of 2 already.
