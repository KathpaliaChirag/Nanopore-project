# Configuration file for Luna (student@dell-R760, dual-socket Intel Xeon Platinum 8468 "Sapphire Rapids")
# Cache geometry (size/associativity/sets/line size below) read directly from this exact machine via
# /sys/devices/system/cpu/cpu0/cache/index*/ on 2026-09-04 - not taken from a vendor spec sheet.
# See cache_simulation/command_log.md steps 11-15 for the full derivation and what's measured vs. looked up.
#
# NOT yet real/measured: L3 data_access_time/tags_access_time (sysfs exposes geometry, not latency -
# these are placeholder estimates carried over from beckton.cfg's 24MB/16-way LLC, same order of
# magnitude class of cache; needs a real membench/pointer-chase measurement to replace), and the
# [perf_model/dram] section (channel count, bandwidth, latency - inherited from nehalem/gainestown
# defaults, not measured on Luna). Core timing model (interval_timer, branch predictor) is also
# inherited from the "nehalem" core model since Sniper has no Sapphire Rapids/Golden Cove core model -
# only the cache hierarchy below is asserted as real for this machine.

#include nehalem

[perf_model/core]
frequency = 2.1 # Xeon Platinum 8468 documented base clock (Intel spec) - NOT the 3.8GHz turbo max lscpu reports

[perf_model/l1_icache]
cache_size = 32          # KB - matches nehalem default, confirmed real via sysfs
associativity = 8        # sysfs: ways_of_associativity (nehalem default was 4 - overridden)

[perf_model/l1_dcache]
cache_size = 48           # KB - sysfs (nehalem default was 32 - overridden)
associativity = 12        # sysfs (nehalem default was 8 - overridden)

[perf_model/l2_cache]
cache_size = 2048         # KB = 2MB, private per core - sysfs (nehalem default was 256 - overridden)
associativity = 16        # sysfs (nehalem default was 8 - overridden)

[perf_model/l3_cache]
perfect = false
cache_block_size = 64
cache_size = 107520        # KB = ~105MB per socket - sysfs, shared across the whole socket
associativity = 15         # sysfs - note: unusual (non-power-of-2) value, real hardware read, not a typo
address_hash = mask
replacement_policy = lru   # NOT verified for this silicon - real replacement policy is undocumented
                            # (see project memory: Sapphire Rapids LLC uses an adaptive bimodal insertion
                            # policy, reverse-engineered only through Skylake-gen chips). lru is Sniper's
                            # standard placeholder until this is modeled explicitly.
data_access_time = 35      # PLACEHOLDER - not sysfs-derived, needs real measurement
tags_access_time = 12      # PLACEHOLDER - not sysfs-derived, needs real measurement
perf_model_type = parallel
writethrough = 0
shared_cores = 96          # real: 96 cores share this L3 per socket (sysfs shared_cpu_list confirmed
                            # 96 entries). if simulating fewer than 96 cores, revisit whether Sniper
                            # expects this to match the simulated core count instead of the real machine.
