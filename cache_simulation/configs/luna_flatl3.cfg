# Naive flat L3 overlay for Luna - counterpart to the NUCA model in luna.cfg.
# To-do item 1 from command_log.md: compare a single monolithic L3 bank
# against the per-core NUCA mesh-slice model every other Luna experiment in
# this project has used. Load AFTER luna.cfg so L1i/L1d/L2/frequency stay
# real, but this REPLACES the cache-level topology: levels=3 (not 2), with
# an explicit flat [perf_model/l3_cache] instead of relying on
# meteor_lake_pcore's NUCA chain.
#   ./run-sniper -c address_translation_schemes/baseline -c luna -c luna_flatl3 ...
#
# Sizing: Luna's real aggregate L3 (105MB total, 15-way, per sysfs - same
# number luna.cfg's NUCA split derives its 1125KB/core slice from) modeled
# as ONE block instead of 96 per-core slices. 105MB = 107520KB; at 15-way,
# 64B blocks: sets = 107520*1024/(15*64) = 114688 sets exactly - checked
# this is NOT a power of 2 (114688 = 2^14 * 7) before picking address_hash,
# since the NUCA config in luna.cfg already hit exactly this bug once
# (xor_mod/mask-style indexing goes out of bounds for a non-power-of-2 set
# count -> SIGSEGV). Using "mod" below, same fix as luna.cfg's NUCA slice.
#
# CAVEAT: with -n 1 (single core, as every experiment in this project uses),
# NUCA-vs-flat mainly changes the LATENCY MODEL (distance-independent single
# bank vs. mesh-routing formula), not capacity - a real multi-core NUCA
# workload would show a bigger topology effect than what a single-core run
# can expose. Still a real, useful data point for the latency-model question
# specifically. Not yet independently sanity-tested at time of writing -
# check the first real run's IPC/IPC-consistency before trusting this config.

[perf_model/cache]
levels = 3

[perf_model/l3_cache]
cache_size = 107520        # KB, Luna's real aggregate L3 (105MB), one flat block
associativity = 15         # sysfs real, same value luna.cfg's NUCA slice uses
shared_cores = 1           # every experiment in this project runs -n 1 (single core);
                            # matches nehalem.cfg's own single-core-per-L3 convention,
                            # since no second core is ever simulated to actually share with
cache_block_size = 64
address_hash = mod         # REQUIRED: 114688 sets is NOT a power of 2 (2^14*7), so
                            # nehalem.cfg's own default ("mask") would be unsafe here -
                            # same class of bug luna.cfg's NUCA config already hit and
                            # fixed with "mod", which has no power-of-2 restriction
dvfs_domain = global
prefetcher = none
writeback_time = 0
perf_model_type = parallel # matches nehalem.cfg's own L1/L2/L3 convention
writethrough = 0           # matches nehalem.cfg's own L1/L2/L3 convention
replacement_policy = lru   # matches the NUCA config's own value (meteor_lake_pcore.cfg),
                            # so this comparison isolates topology, not replacement policy
tags_access_time = 15      # SAME placeholder as the NUCA config uses (meteor_lake_pcore.cfg
data_access_time = 20      # [perf_model/nuca]) - intentionally kept identical so this
                            # experiment isolates topology (flat vs NUCA-mesh), not a
                            # latency-assumption difference. Still a known placeholder,
                            # not independently measured (same caveat luna.cfg's own NUCA
                            # section already carries).
