# Hardware LLC associativity sweep - forces NUCA associativity to 30-way while
# keeping the per-core slice size fixed at Luna's real 1125 KB (18000 total 64B blocks).
# sets = 18000 / 30 = 600 (exact, no rounding). Load AFTER luna.cfg:
#   -c address_translation_schemes/baseline -c luna -c hw_assoc/luna_assoc30
# See hw_assoc/README.md for the full sweep rationale and the divisor table.

[perf_model/nuca]
cache_size = 1125          # KB per-core slice, same as luna.cfg - only associativity changes
associativity = 30
address_hash = mod         # required: 600 sets is not a power of 2, xor_mod would go out of bounds
