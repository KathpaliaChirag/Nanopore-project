# Overlay config simulating Orion's (Jetson AGX Orin) cache SIZES in place of Luna's real
# server-class cache - a config-only edge-device comparison, not a run on real Orion hardware.
# Same pattern as luna.cfg/desktop.cfg: override layer on address_translation_schemes/baseline
# + meteor_lake_pcore, cache geometry only.
# Correct invocation: ./run-sniper -c address_translation_schemes/baseline -c orion_sizes ...
#
# IMPORTANT - this tests hardware CACHE SIZE sensitivity only, not real Orion behavior. It
# still runs the existing x86 kraken2 binaries under meteor_lake_pcore's x86 core timing model -
# it does NOT capture Orion's real ARM Cortex-A78AE pipeline, branch predictor, or any other
# core-level difference. A true "ran on real Orion" claim needs the DynamoRIO/ARM route
# (documented in Sniper's README.arm64, paused per CK 2026-09-09) - this is the fast, config-only
# stand-in that answers the narrower "how does hardware cache size alone change the S2 cache's
# payoff" question, which is what Thesis 1's "LLC-topology-aware sizing" piece actually needs.
#
# Sizes: real, from prior project research (see project memory / dorado-kraken-research):
#   L1d/L1i: 64KB each (NVIDIA Jetson AGX Orin spec)
#   L2: 256KB per core (NVIDIA spec)
#   SLC (System Level Cache, the closest analog to a shared LLC): 4MB total, shared across
#   all 12 real CPU cores (Jetson AGX Orin: 12x Cortex-A78AE)
#
# Associativity: NOT independently verified for this exact silicon (project memory already
# flags this - a prior "8-way L2" claim was traced to a search-tool paraphrase and retracted).
# L1/L2 values below are ARM's own Cortex-A78AE Technical Reference Manual TYPICAL
# configuration (a real documented reference design default, not a guess) - the exact NVIDIA
# SKU could differ. SLC associativity is NVIDIA proprietary IP, genuinely unknown - kept at 16
# purely as a consistent placeholder, explicitly not asserted as fact.

[perf_model/core]
frequency = 2.2 # Jetson AGX Orin MAXN mode documented max clock (from project memory - matches
                # the same value used for the earlier real-vs-simulated Orion MIPS estimate)

[perf_model/l1_icache]
cache_size = 64
associativity = 4  # ARM Cortex-A78AE TRM typical config - NOT independently verified for this SKU

[perf_model/l1_dcache]
cache_size = 64
associativity = 4  # ARM Cortex-A78AE TRM typical config - NOT independently verified for this SKU

[perf_model/l2_cache]
cache_size = 256
associativity = 8  # ARM Cortex-A78AE TRM typical config - NOT independently verified for this SKU

[perf_model/nuca]
cache_size = 342         # KB per-core slice = 4096 KB (4MB SLC) / 12 real cores (approx - 4096/12
                          # = 341.33, rounded to 342)
associativity = 16       # UNVERIFIED PLACEHOLDER - SLC is NVIDIA proprietary IP, no public source
address_hash = mod       # REQUIRED - 342 sets is not a power of 2, same xor_mod bug as luna.cfg
