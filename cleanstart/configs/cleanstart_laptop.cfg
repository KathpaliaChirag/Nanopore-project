# cleanstart overlay, loaded AFTER laptop.cfg:
#   ./run-sniper -c address_translation_schemes/baseline -c laptop -c cleanstart_laptop ...
# copy to ~/cache_simulation/snipersim/config/cleanstart_laptop.cfg on Luna.
#
# adds what laptop.cfg left at Sniper defaults, to match the Ryzen 7 5800H (Zen 3):
#  - instruction cache modeling ON (was "false" in every old run; L1i is 32KB/8-way from laptop.cfg)
#  - L1 TLBs fully associative, 64 entries each (Zen 3: 64-entry fully-assoc L1 DTLB and ITLB;
#    from AMD's published Zen 3 numbers as recalled, not re-verified against the manual)
#  - L2 TLB left as Sniper default: 2048 entries, 8-way, unified (matches Zen 3's 2048-entry 8-way
#    L2 DTLB; Zen 3's separate 512-entry L2 ITLB has no equivalent here, Sniper's L2 TLB is unified)
# NOT set here (by design): total L3 size and core count. run_one.sh sets those per run with
# -c overrides so total L3 stays fixed as cores change (per-slice size = total / cores).

[general]
enable_icache_modeling = true

[perf_model/mmu/tlb_level_1/tlb1]
assoc = 64

[perf_model/mmu/tlb_level_1/tlb2]
assoc = 64

[perf_model/mmu/tlb_level_1/tlb3]
assoc = 64
